<!DOCTYPE html>

  <head>

    <title>Document</title>

  <body>
    <script>
      // spread denoted by and it is usde to combined or merge more than one array

      var emp1 = new Array("brijesh", "jekin", "milan");
      var emp2 = new Array("jay", "man", "lalji");
      var emp3 = new Array("rohan", "kajal", "komal");
      var res = [...emp1, ...emp2, ...emp3];
      console.log(res);
    </script>
  </body>
