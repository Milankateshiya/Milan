<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // <!-- array as literals
      //     when we define any array as literals we stored data inside of []
      //     array : array is used to stored multiple data in a single variables or elements i.e called array.
      //     let emp=['brijesh','jay','mohan'];
      //     array as literals -->

      let emp = ["brijesh", "jay", "milan", "raj", "mohan"];
      //   console.log(emp);
      var i;
      for (i = 0; i < emp.length; i++) {
        //console.log(emp[i],"\n")

        
        document.write(emp[i] + "<br>");
      }
    </script>
  </body>
</html>
